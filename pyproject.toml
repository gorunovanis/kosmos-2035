[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kosmo"
version = "0.1.0"
description = "Digital contour for the fuel node planning case «Топливный космоконтур 2035»"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
